<style>
:root{
  --ink:#171A2B; --indigo:#1E2B78; --mile:#FFC42E; --chilli:#DC3B2A;
  --steel:#ECEEF3; --mute:#5B6178; --leaf:#2F7D4F; --line:#D9DCE6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Hind','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#C9CEDD;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mile);outline-offset:2px}
#app{max-width:520px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--steel);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(20,20,60,.25)}

/* header */
header{flex:none;background:var(--indigo);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:'Rozha One',Georgia,serif;font-size:27px;line-height:1;color:var(--mile);margin:0;font-weight:400}
.brand small{font-size:15px;color:#fff;opacity:.85;margin-left:8px}
.loc{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:9px 13px;font-weight:600;font-size:14px;max-width:58%;min-height:40px}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc svg{flex:none}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#mapwrap{height:100%;display:flex;flex-direction:column}

/* nav */
nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--mute)}
nav button.on{color:var(--indigo)}
nav button.on svg{stroke:var(--indigo);fill:var(--mile)}
nav svg{fill:none;stroke:currentColor}

/* sign hero */
.sign{margin:14px 12px 4px;background:var(--chilli);color:#fff;border-radius:16px;padding:22px 20px 20px;position:relative;
  background-image:radial-gradient(rgba(255,255,255,.13) 1.4px,transparent 1.6px);background-size:14px 14px}
.sign::after{content:"";position:absolute;inset:7px;border:2.5px solid var(--mile);border-radius:11px;pointer-events:none}
.sign h2{font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:36px;line-height:1.05;margin:0 0 6px}
.sign p{margin:0 0 16px;font-size:17px;max-width:30ch}
.sign .row{position:relative;z-index:1}

/* filters */
.filters{padding:12px 12px 2px;position:sticky;top:0;background:var(--steel);z-index:5}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;border:0;background:none;padding:12px 0;font-size:16px;min-width:0}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--indigo)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.count{padding:2px 14px 0;color:var(--mute);font-size:14px}

/* cards */
.card{background:#fff;border-radius:20px;margin:12px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 8px 20px -10px rgba(30,43,120,.3)}
.ph{position:relative;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .em{font-size:92px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28));position:relative}
.ph::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1.6px,transparent 1.8px);background-size:16px 16px}
.mile{position:absolute;left:12px;top:12px;width:72px;border-radius:36px 36px 6px 6px;overflow:hidden;text-align:center;background:#fff;color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.mile span{display:block;background:var(--mile);padding:8px 5px 4px;font-weight:700;font-size:11.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mile b{display:block;padding:4px 2px 6px;font-size:15px;line-height:1.1}
.citytag{position:absolute;left:12px;top:12px;background:var(--mile);color:var(--ink);font-weight:700;font-size:13px;padding:6px 11px;border-radius:10px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heart{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.heart svg{stroke:var(--ink);fill:none}
.heart.on svg{stroke:var(--chilli);fill:var(--chilli)}
.heart.pop{animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.body{padding:14px 16px 16px}
.body h3{font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:24px;line-height:1.15;margin:0 0 2px}
.where{margin:0 0 10px;color:var(--mute);font-size:15px}
.must{background:#FFF6D9;border-left:4px solid var(--mile);border-radius:4px 12px 12px 4px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.must small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.desc{margin:0 0 10px;font-size:16px;max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{background:var(--steel);border-radius:8px;padding:4px 9px;font-size:13.5px;font-weight:500}
.tag.stars{background:#E6F3EA;color:var(--leaf);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}

.btn{border:1.5px solid var(--indigo);color:var(--indigo);background:#fff;border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--indigo);color:#fff}
.btn.mile-btn{background:var(--mile);border-color:var(--mile);color:var(--ink)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.danger{border-color:#F0C4BE;color:var(--chilli)}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* empty */
.empty{margin:24px 16px;text-align:center;color:var(--mute)}
.empty h3{font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:24px;color:var(--ink);margin:6px 0}
.empty .em{font-size:52px}
.empty .row{justify-content:center;margin-top:14px}

/* forms */
.page{padding:16px 16px 28px}
.page h2{font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:28px;margin:0 0 4px}
.page h3{font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:22px;margin:0 0 4px}
.lead{margin:0 0 16px;color:var(--mute)}
label{display:block;font-weight:600;font-size:14.5px;margin-bottom:12px}
label small{font-weight:500;color:var(--mute)}
input[type=text],input[type=search],select,textarea{width:100%;margin-top:5px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:400}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.box legend{font-weight:700;padding:0 6px}
.status{margin:8px 0 0;font-size:14px;color:var(--mute)}
.status.ok{color:var(--leaf);font-weight:600}
.preview{margin-top:8px;max-height:150px;border-radius:12px;display:none}
hr{border:0;border-top:1.5px dashed var(--line);margin:22px 0}

/* sheet + toast */
.scrim{position:absolute;inset:0;background:rgba(15,18,40,.5);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));z-index:41;animation:up .22s ease;max-height:88%;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h2{font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:26px;margin:0 0 12px}
.sheet label{margin-top:14px}
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:60;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* map */
#map{flex:1;min-height:260px;background:#dfe3ee}
.maphead{padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}
.pin{background:none;border:0}
.pin span{display:grid;place-items:center;width:36px;height:36px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--mile);border:2.5px solid var(--ink);box-shadow:0 3px 6px rgba(0,0,0,.35)}
.pin i{transform:rotate(45deg);font-style:normal;font-size:18px}
.leaflet-popup-content{font-family:inherit;margin:12px 14px}
.pop-t{font-family:'Rozha One',Georgia,serif;font-size:18px;margin:0 0 2px}
.pop-a{display:inline-block;margin-top:8px;font-weight:700;color:var(--indigo)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function fmtD(d) {
  if (d < 1) return Math.max(10, Math.round(d * 100) * 10) + ' m';
  if (d < 10) return d.toFixed(1) + ' km';
  return Math.round(d).toLocaleString('en-US') + ' km';
}
function hash(str) { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function emojiFor(cu) {
  const t = (cu || []).join(' ').toLowerCase();
  const m = [['biryani','🍛'],['kebab','🍢'],['pizza','🍕'],['noodle','🍜'],['ramen','🍜'],['sweet','🍬'],['bakery','🥐'],['seafood','🦐'],['cafe','☕'],['chai','☕'],['dosa','🥞'],['south indian','🥞'],['burger','🍔'],['deli','🥪'],['sushi','🍣'],['mexican','🌮'],['italian','🍝'],['street','🥙'],['chaat','🥣']];
  for (const [k, e] of m) if (t.includes(k)) return e;
  return '🍽️';
}
const mapsQuery = s => s.source === 'user'
  ? `${s.lat},${s.lng}`
  : encodeURIComponent(`${s.name} ${s.city}`);
const mapsUrl = s => `https://www.google.com/maps/search/?api=1&query=${mapsQuery(s)}`;
const dirUrl  = s => `https://www.google.com/maps/dir/?api=1&destination=${mapsQuery(s)}`;

/* ---------- storage: uses persistent storage when it exists, else the browser, else memory ---------- */
const mem = {};
const store = {
  async get(k) {
    try { if (window.storage) { const r = await window.storage.get(k); if (r && r.value) return JSON.parse(r.value); } } catch (e) {}
    try { const v = window.localStorage.getItem(k); if (v) return JSON.parse(v); } catch (e) {}
    return mem[k] ?? null;
  },
  async set(k, v) {
    mem[k] = v;
    const s = JSON.stringify(v);
    try { if (window.storage) { await window.storage.set(k, s); return; } } catch (e) {}
    try { window.localStorage.setItem(k, s); } catch (e) {}
  }
};

/* ---------- state ---------- */
const S = { tab:'feed', loc:null, radius:50, q:'', cuisine:'all', user:[], cloud:[], saved:[], sheet:false, map:null, photo:null };
const persist = () => store.set('swaad:v1', { user:S.user, saved:S.saved, loc:S.loc, radius:S.radius });

const allSpots = () => { const seen = new Set(); return [...S.user, ...S.cloud, ...SEED].filter(s => !seen.has(s.id) && seen.add(s.id)); };
const byId = id => allSpots().find(s => s.id === id);
const hay = s => [s.name, s.dish, s.city, s.area, s.country, (s.cuisine||[]).join(' ')].join(' ').toLowerCase();

function baseList() {
  const t = S.q.trim().toLowerCase();
  let a = allSpots().map(s => ({ s, d: S.loc ? km(S.loc.lat, S.loc.lng, s.lat, s.lng) : null }));
  if (S.cuisine !== 'all') a = a.filter(x => (x.s.cuisine||[]).includes(S.cuisine));
  if (t) a = a.filter(x => hay(x.s).includes(t));
  return a;
}
function feedList() {
  let a = baseList();
  if (S.loc && S.radius > 0) a = a.filter(x => x.d <= S.radius);
  if (S.loc) a.sort((p, q) => p.d - q.d);
  return a;
}
function cities() {
  const m = new Map();
  for (const s of allSpots()) {
    const k = s.city + '|' + s.country;
    const c = m.get(k) || { city:s.city, country:s.country, la:0, lo:0, n:0 };
    c.la += s.lat; c.lo += s.lng; c.n++; m.set(k, c);
  }
  return [...m.values()].map(c => ({ ...c, lat:c.la/c.n, lng:c.lo/c.n })).sort((a, b) => a.city.localeCompare(b.city));
}
function cuisineChips() {
  const f = {};
  allSpots().forEach(s => (s.cuisine||[]).forEach(c => f[c] = (f[c]||0) + 1));
  return Object.entries(f).sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]);
}

/* ---------- cards ---------- */
function card(x) {
  const s = x.s, d = x.d;
  const pal = PALETTES[hash(s.id) % PALETTES.length];
  const saved = S.saved.includes(s.id);
  const em = s.emoji || emojiFor(s.cuisine);
  const badge = d != null
    ? `<div class="mile"><span>${esc(s.city)}</span><b>${fmtD(d)}</b></div>`
    : `<div class="citytag">${esc(s.city)}</div>`;
  const where = [s.area, s.city, s.country].filter(Boolean).join(', ');
  const tags = [];
  if (s.rating) tags.push(`<span class="tag stars">${'★'.repeat(Math.round(s.rating))} ${Number(s.rating).toFixed(1)}</span>`);
  if (s.price) tags.push(`<span class="tag">${PRICE[s.price]}</span>`);
  (s.cuisine||[]).forEach(c => tags.push(`<span class="tag">${esc(c)}</span>`));
  return `<article class="card" data-id="${esc(s.id)}">
    <div class="ph" style="background:linear-gradient(140deg,${pal[0]},${pal[1]})">
      <span class="em" aria-hidden="true">${em}</span>
      ${s.photo ? `<img src="${esc(s.photo)}" alt="${esc(s.name)}" loading="lazy" onerror="this.remove()">` : ''}
      ${badge}
      <button class="heart ${saved ? 'on' : ''}" data-act="save" data-id="${esc(s.id)}" aria-label="${saved ? 'Remove from saved' : 'Save spot'}" aria-pressed="${saved}">${ICO.heart}</button>
    </div>
    <div class="body">
      <h3>${esc(s.name)}</h3>
      <p class="where">${esc(where)}</p>
      ${s.dish ? `<div class="must"><small>Must try</small>${esc(s.dish)}</div>` : ''}
      ${s.desc ? `<p class="desc">${esc(s.desc)}</p>` : ''}
      <div class="tags">${tags.join('')}</div>
      <div class="actions">
        <a class="btn primary" href="${mapsUrl(s)}" target="_blank" rel="noopener">Open in Maps</a>
        <a class="btn" href="${dirUrl(s)}" target="_blank" rel="noopener">Directions</a>
        <button class="btn ghost" data-act="share" data-id="${esc(s.id)}">Share</button>
        ${s.source === 'user' ? `<button class="btn danger" data-act="del" data-id="${esc(s.id)}">Delete</button>` : ''}
      </div>
    </div>
  </article>`;
}

/* ---------- location ---------- */
function setLoc(l, quiet) {
  S.loc = l; persist(); cloudLoad();
  if (S.sheet) closeSheet();
  if (S.tab === 'feed') renderFeed(); else refresh();
  $('#locLabel').textContent = l ? l.label : 'Set location';
  if (!quiet && l) toast('Showing spots near ' + l.label);
}
function locate() {
  if (!navigator.geolocation) { toast("Location isn't available here. Pick a city instead."); return; }
  toast('Finding you...');
  navigator.geolocation.getCurrentPosition(p => {
    const lat = p.coords.latitude, lng = p.coords.longitude;
    let label = 'Your location';
    const c = cities().map(c => ({ c, d: km(lat, lng, c.lat, c.lng) })).sort((a, b) => a.d - b.d)[0];
    if (c && c.d < 60) label = 'Near ' + c.c.city;
    setLoc({ lat, lng, label, source: 'gps' });
  }, err => {
    toast(err && err.code === 1 ? 'Location is blocked. Allow it in your browser settings, or pick a city.' : "Couldn't get your location. Pick a city instead.");
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

/* ---------- shared spots (optional Supabase) ---------- */
async function cloudLoad() {
  if (!CLOUD.url) return;
  let q = 'approved=eq.true&select=*&limit=500';
  if (S.loc && S.radius > 0) {
    const dLa = S.radius / 111, dLo = S.radius / (111 * Math.max(0.2, Math.cos(S.loc.lat * Math.PI / 180)));
    q += `&lat=gte.${S.loc.lat - dLa}&lat=lte.${S.loc.lat + dLa}&lng=gte.${S.loc.lng - dLo}&lng=lte.${S.loc.lng + dLo}`;
  }
  try {
    const r = await fetch(`${CLOUD.url}/rest/v1/spots?${q}`, { headers: { apikey: CLOUD.key, Authorization: 'Bearer ' + CLOUD.key } });
    if (!r.ok) throw new Error(r.status);
    const rows = await r.json();
    S.cloud = rows.map(o => ({ id:'c'+o.id, name:o.name, area:o.area||'', city:o.city, country:o.country||'', lat:+o.lat, lng:+o.lng,
      cuisine:o.cuisine||[], dish:o.dish||'', price:o.price||0, rating:+o.rating||0, desc:o.description||'', photo:o.photo_url||'', emoji:'', source:'cloud' }));
    refresh();
  } catch (e) { toast("Couldn't load shared spots right now."); }
}
async function cloudSubmit(s) {
  if (!CLOUD.url) return false;
  try {
    const r = await fetch(`${CLOUD.url}/rest/v1/spots`, {
      method: 'POST',
      headers: { apikey: CLOUD.key, Authorization: 'Bearer ' + CLOUD.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ name:s.name, area:s.area, city:s.city, country:s.country, lat:s.lat, lng:s.lng, cuisine:s.cuisine, dish:s.dish, price:s.price||null, rating:s.rating||null, description:s.desc, photo_url:/^https?:/.test(s.photo) ? s.photo : null })
    });
    return r.ok;
  } catch (e) { return false; }
}

/* ---------- add / import / export ---------- */
function readPhoto(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function setPin(lat, lng) {
  $('#f-lat').value = (+lat).toFixed(6); $('#f-lng').value = (+lng).toFixed(6);
  const st = $('#locStatus'); st.textContent = `Location set: ${(+lat).toFixed(4)}, ${(+lng).toFixed(4)}`; st.className = 'status ok';
}
function parseMapsLink(t) {
  const pats = [/@(-?\d+\.\d+),(-?\d+\.\d+)/, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/];
  for (const p of pats) { const m = t.match(p); if (m) return [+m[1], +m[2]]; }
  return null;
}
async function geocode() {
  const q = [$('#f-name').value, $('#f-area').value, $('#f-city').value, $('#f-country').value].filter(x => x.trim()).join(' ');
  if (!$('#f-city').value.trim()) { toast('Enter the city first.'); return; }
  toast('Searching...');
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (!j.length) { toast("Couldn't find it. Paste a Google Maps link or use your location."); return; }
    setPin(j[0].lat, j[0].lon); toast('Location found. Check it in Maps before saving.');
  } catch (e) { toast("Search isn't available right now. Paste a Google Maps link instead."); }
}
function gpsFill() {
  if (!navigator.geolocation) { toast("Location isn't available here."); return; }
  navigator.geolocation.getCurrentPosition(p => setPin(p.coords.latitude, p.coords.longitude),
    () => toast("Couldn't get your location. Paste a Google Maps link instead."), { enableHighAccuracy: true, timeout: 12000 });
}
async function submit() {
  const g = id => $('#' + id).value.trim();
  const lat = parseFloat(g('f-lat')), lng = parseFloat(g('f-lng'));
  if (!g('f-name')) return toast('Add the spot name.');
  if (!g('f-city')) return toast('Add the city.');
  if (!g('f-dish')) return toast('Add a must-try dish.');
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return toast('Set the location first.');
  const cu = g('f-cuisine').split(/[;,]/).map(x => x.trim()).filter(Boolean);
  const s = { id:'u' + Date.now().toString(36), name:g('f-name'), area:g('f-area'), city:g('f-city'), country:g('f-country'), lat, lng,
    cuisine:cu, dish:g('f-dish'), price:+$('#f-price').value, rating:+$('#f-rating').value, desc:g('f-desc'), photo:S.photo || '', emoji:emojiFor(cu), source:'user' };
  S.user.unshift(s); persist();
  if (S.loc && S.radius > 0 && km(S.loc.lat, S.loc.lng, lat, lng) > S.radius) S.radius = 0;
  S.q = ''; S.cuisine = 'all';
  const sent = await cloudSubmit(s);
  toast(CLOUD.url ? (sent ? 'Spot saved and sent for review.' : 'Spot saved here. Sending failed, try again later.') : 'Spot saved.');
  S.tab = 'feed'; render();
}

function parseCSV(t) {
  t = t.replace(/^\uFEFF/, '');
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i+1] === '\n') i++; r.push(f); f = ''; if (r.some(x => x.trim())) rows.push(r); r = []; }
    else f += c;
  }
  r.push(f); if (r.some(x => x.trim())) rows.push(r);
  if (rows.length < 2) return [];
  const head = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1).map(row => Object.fromEntries(head.map((h, i) => [h, row[i] ?? ''])));
}
function norm(o, i) {
  const g = k => String(o[k] ?? '').trim();
  const lat = parseFloat(g('lat')), lng = parseFloat(g('lng') || g('lon') || g('long'));
  if (!g('name') || !g('city') || !isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  let cu = o.cuisine; if (typeof cu === 'string') cu = cu.split(/[;,|]/);
  cu = (cu || []).map(x => String(x).trim()).filter(Boolean);
  const pr = parseInt(g('price'), 10), rt = parseFloat(g('rating'));
  return { id:'u' + Date.now().toString(36) + i, name:g('name'), area:g('area'), city:g('city'), country:g('country'), lat, lng, cuisine:cu,
    dish:g('dish'), price:[1,2,3].includes(pr) ? pr : 0, rating:rt >= 1 && rt <= 5 ? rt : 0, desc:g('description') || g('desc'),
    photo:/^https?:\/\//.test(g('photo')) ? g('photo') : '', emoji:emojiFor(cu), source:'user' };
}
async function importFile(file) {
  try {
    const text = await file.text();
    let rows;
    if (/\.json$/i.test(file.name) || text.trim().startsWith('[')) { rows = JSON.parse(text); if (!Array.isArray(rows)) throw 0; }
    else rows = parseCSV(text);
    const ok = rows.map(norm).filter(Boolean);
    S.user = [...ok, ...S.user]; persist();
    S.radius = S.loc ? 0 : S.radius;
    toast(`Imported ${ok.length} spot${ok.length === 1 ? '' : 's'}${rows.length - ok.length ? `, skipped ${rows.length - ok.length} (missing name, city or location)` : ''}.`);
    S.tab = 'feed'; render();
  } catch (e) { toast("Couldn't read that file. Use the CSV template."); }
}
const csvCell = v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const HEAD = ['name','area','city','country','lat','lng','cuisine','dish','price','rating','description','photo'];
function toCSV(list) {
  return [HEAD.join(','), ...list.map(s => [s.name, s.area, s.city, s.country, s.lat, s.lng, (s.cuisine||[]).join(';'), s.dish, s.price || '', s.rating || '', s.desc, /^https?:/.test(s.photo) ? s.photo : ''].map(csvCell).join(','))].join('\n');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function template() {
  const ex = [{ name:"Example Chaat Corner", area:"Main Market", city:"Dehradun", country:"India", lat:30.3165, lng:78.0322, cuisine:["Chaat","Vegetarian"], dish:"Aloo tikki", price:1, rating:4, desc:"Crispy tikki, tangy chutneys.", photo:"" }];
  download('swaad-template.csv', toCSV(ex), 'text/csv');
}

async function share(id) {
  const s = byId(id); if (!s) return;
  const text = `${s.name}, ${s.city}. Must try: ${s.dish}`;
  try { if (navigator.share) { await navigator.share({ title: s.name, text, url: mapsUrl(s) }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text + ' ' + mapsUrl(s)); toast('Link copied.'); }
  catch (e) { toast("Couldn't share from here."); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const nb = e.target.closest('nav button'); if (nb) { S.tab = nb.dataset.tab; render(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case 'tab': S.tab = t.dataset.tab; render(); break;
    case 'openSheet': openSheet(); break;
    case 'closeSheet': closeSheet(); break;
    case 'locate': locate(); break;
    case 'clearLoc': setLoc(null, true); toast('Location cleared.'); break;
    case 'showAll': S.radius = 0; persist(); updateList(); break;
    case 'chip': S.cuisine = t.dataset.c; updateChips(); updateList(); break;
    case 'save': {
      const i = S.saved.indexOf(id); if (i > -1) S.saved.splice(i, 1); else S.saved.push(id); persist();
      if (S.tab === 'saved') renderSaved();
      else { $$(`.heart[data-id="${CSS.escape(id)}"]`).forEach(b => { const on = S.saved.includes(id); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.classList.remove('pop'); void b.offsetWidth; if (on) b.classList.add('pop'); }); }
      break;
    }
    case 'share': share(id); break;
    case 'del': if (confirm('Delete this spot?')) { S.user = S.user.filter(s => s.id !== id); S.saved = S.saved.filter(x => x !== id); persist(); refresh(); toast('Spot deleted.'); } break;
    case 'gpsFill': gpsFill(); break;
    case 'geocode': geocode(); break;
    case 'submit': submit(); break;
    case 'tpl': template(); break;
    case 'import': $('#imp').click(); break;
    case 'expCsv': S.user.length ? download('my-spots.csv', toCSV(S.user), 'text/csv') : toast('You have not added any spots yet.'); break;
    case 'expJson': S.user.length ? download('my-spots.json', JSON.stringify(S.user, null, 2), 'application/json') : toast('You have not added any spots yet.'); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; updateList(); }
  if (e.target.id === 'f-link') { const p = parseMapsLink(e.target.value); if (p) { setPin(p[0], p[1]); } }
});
document.addEventListener('change', async e => {
  const id = e.target.id;
  if (id === 'citySel' && e.target.value !== '') { const c = cities()[+e.target.value]; setLoc({ lat:c.lat, lng:c.lng, label:c.city, source:'city' }); }
  if (id === 'radiusSel') { S.radius = +e.target.value; persist(); cloudLoad(); refresh(); }
  if (id === 'imp' && e.target.files[0]) { await importFile(e.target.files[0]); e.target.value = ''; }
  if (id === 'f-photo' && e.target.files[0]) {
    try { S.photo = await readPhoto(e.target.files[0]); const p = $('#f-prev'); p.src = S.photo; p.style.display = 'block'; }
    catch (err) { toast("Couldn't read that photo."); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });

/* ---------- start ---------- */
(async () => {
  const d = await store.get('swaad:v1');
  if (d) { S.user = d.user || []; S.saved = d.saved || []; S.loc = d.loc || null; S.radius = d.radius ?? 50; }
  render(); cloudLoad();
})();
})();
</script>
